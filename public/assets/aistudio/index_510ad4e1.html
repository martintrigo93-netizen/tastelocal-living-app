<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TasteLocal Living te ayuda a descubrir planes y experiencias locales únicas, personalizadas según tu estado de ánimo y energía. Deja que nuestra IA diseñe tu día perfecto.">
  <title>TasteLocal Living</title>
  <!--
    NOTA PARA EL DESARROLLADOR:
    Esta aplicación utiliza la librería @vis.gl/react-google-maps.
    El componente APIProvider se encarga de cargar dinámicamente el SDK de Google Maps.
  -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
  <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
  <style>
    html, body, #root {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .scrollbar-hide::-webkit-scrollbar {
        display: none;
    }
    .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.5s ease-in-out;
    }
    /* Animación escalonada para listas */
    .animate-fade-in-stagger {
      animation: fadeIn 0.5s ease-in-out both;
    }
    /* Clase de utilidad para accesibilidad: oculta visualmente pero accesible para lectores de pantalla */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }
  </style>
<link rel="stylesheet" href="/index.css">
</head>
<body>
  <div id="root"></div>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.14.0",
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react-dom/": "https://esm.sh/react-dom@18.2.0/",
    "react/": "https://esm.sh/react@18.2.0/",
    "@vis.gl/react-google-maps": "https://esm.sh/@vis.gl/react-google-maps@^1.1.0"
  }
}
</script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
