<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="tlGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FF5E2B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0F1015" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tlOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A4D"/>
      <stop offset="100%" stop-color="#FF5E2B"/>
    </linearGradient>
    <filter id="tlShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#FF5E2B" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background in Onyx Black #0F1015 -->
  <rect width="512" height="512" rx="112" fill="#0F1015"/>
  <circle cx="256" cy="230" r="210" fill="url(#tlGlow)"/>

  <!-- Subtle Outer Accent Ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4"/>

  <!-- Pin Shape with Shadow -->
  <g filter="url(#tlShadow)">
    <path d="M256 90 C175 90 110 155 110 236 C110 320 235 410 256 422 C277 410 402 320 402 236 C402 155 337 90 256 90 Z"
          fill="url(#tlOrangeGrad)"/>
    <!-- Inner Pin Core / Portal -->
    <circle cx="256" cy="236" r="64" fill="#0F1015"/>
    <circle cx="256" cy="236" r="28" fill="#FFFFFF"/>
    <!-- Compass / Vibe Spark -->
    <polygon points="256,192 264,228 300,236 264,244 256,280 248,244 212,236 248,228" fill="#FF5E2B"/>
  </g>

  <!-- Brand Typography Monogram Accent -->
  <text x="256" y="475" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="6">TASTELOCAL</text>
</svg>
